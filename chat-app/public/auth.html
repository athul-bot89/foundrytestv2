<!DOCTYPE html>
<html>
<head>
    <title>Authenticating...</title>
    <link rel="modulepreload" href="https://esm.sh/@azure/msal-browser@5.11.0" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .auth-status {
            text-align: center;
            color: #333;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #0078d4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="auth-status">
        <div class="spinner"></div>
        <h2>Authenticating...</h2>
        <p>Please wait while we sign you in.</p>
    </div>

    <script src="/auth-config.js"></script>
    <script type="module">
        import { PublicClientApplication } from "https://esm.sh/@azure/msal-browser@5.11.0";

        const config = window.__AUTH_CONFIG__;

        const msalConfig = {
            auth: {
                clientId: config.clientId,
                authority: `https://login.microsoftonline.com/${config.tenantId}`,
                redirectUri: window.location.origin + "/auth.html",
                navigateToLoginRequestUrl: false
            },
            cache: {
                cacheLocation: "localStorage",
                storeAuthStateInCookie: true
            },
            system: {
                allowRedirectInIframe: false,
                redirectNavigationTimeout: 30000,
                iframeHashTimeout: 10000
            }
        };

        async function run() {
            const msal = new PublicClientApplication(msalConfig);
            await msal.initialize();

            try {
                // Handle the redirect response (if returning from Azure AD)
                const redirectResponse = await msal.handleRedirectPromise();

                // Check if user is already logged in
                const accounts = msal.getAllAccounts();
                const account = redirectResponse?.account || accounts[0];

                if (account) {
                    // Get an access token silently
                    const tokenResponse = await msal.acquireTokenSilent({
                        account: account,
                        scopes: config.scopes
                    });

                    // Send token back to the opener (main app)
                    if (window.opener) {
                        window.opener.postMessage(
                            {
                                type: "AUTH",
                                email: account.username,
                                token: tokenResponse.accessToken
                            },
                            window.location.origin
                        );
                    }

                    // Close the popup
                    window.close();
                    return;
                }

                // No account found — initiate login redirect within the popup
                await msal.loginRedirect({
                    scopes: config.scopes
                });
            } catch (e) {
                console.error("Auth error:", e);

                // Check if user is not assigned to the application (AADSTS50105)
                const errorStr = (e.message || "") + (e.errorMessage || "") + (e.errorCode || "");
                const isNotAuthorized =
                    e.errorCode === "access_denied" ||
                    errorStr.includes("AADSTS50105") ||
                    errorStr.includes("not a direct member") ||
                    errorStr.includes("assigned");

                if (isNotAuthorized) {
                    // Notify the opener that the user is not authorized
                    if (window.opener) {
                        window.opener.postMessage(
                            { type: "AUTH_ERROR", error: "not_authorized" },
                            window.location.origin
                        );
                    }
                    document.querySelector(".auth-status h2").textContent = "Access Denied";
                    document.querySelector(".auth-status p").textContent =
                        "You are not authorized to use this application. Please contact your administrator.";
                    document.querySelector(".spinner").style.display = "none";
                    setTimeout(() => window.close(), 4000);
                    return;
                }

                // On timeout, retry once with a fresh redirect
                if (e.errorCode === "timed_out") {
                    document.querySelector(".auth-status p").textContent = "Retrying sign-in...";
                    try {
                        const msal2 = new PublicClientApplication(msalConfig);
                        await msal2.initialize();
                        await msal2.loginRedirect({ scopes: config.scopes });
                        return;
                    } catch (retryErr) {
                        console.error("Retry failed:", retryErr);
                    }
                }

                document.querySelector(".auth-status h2").textContent = "Authentication failed";
                document.querySelector(".auth-status p").textContent = e.message || "Please close this window and try again.";
                document.querySelector(".spinner").style.display = "none";
            }
        }

        run();
    </script>
</body>
</html>
