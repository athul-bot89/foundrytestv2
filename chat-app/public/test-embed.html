<!DOCTYPE html>
<html>
<head>
  <title>SharePoint Token Simulation</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: #f3f2f1; }
    h2 { color: #323130; }
    .controls { margin-bottom: 16px; display: flex; gap: 10px; align-items: center; }
    button { background: #0078d4; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #106ebe; }
    iframe { width: 100%; height: 700px; border: 1px solid #edebe9; border-radius: 8px; background: white; }
    .info { font-size: 12px; color: #605e5c; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>SharePoint Embed Simulation</h2>
  <div class="controls">
    <button onclick="sendToken()">Send Token to App</button>
    <span class="info">This simulates what the SPFx web part does on a SharePoint page.</span>
  </div>
  <iframe id="app" src="http://localhost:3000"></iframe>

  <script>
    const iframe = document.getElementById('app');

    // Simulate token - in production this comes from AadTokenProvider
    const FAKE_TOKEN = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImtpZCI6Imk2bEdrM0ZaenhSY1ViMkMzbkVRN3N5SEpsWSJ9.eyJhdWQiOiJhcGk6Ly9teS1iYWNrZW5kLWFwaSIsImlzcyI6Imh0dHBzOi8vc3RzLndpbmRvd3MubmV0L2JvdGFuZ2Vsb3MuY29tLyIsImlhdCI6MTcxNjcwMDAwMCwiZXhwIjoxNzE2NzAzNjAwLCJuYW1lIjoiQXRodWwgVGVzdCBVc2VyIiwiZW1haWwiOiJhdGh1bEBib3RhbmdlbG9zLmNvbSIsInNjcCI6ImFjY2Vzc19hc191c2VyIn0.FAKE_SIGNATURE_FOR_LOCAL_TESTING_ONLY';

    const FAKE_USER = {
      name: 'Athul Test User',
      email: 'athul@botangelos.com'
    };

    // Listen for token requests from the iframe
    window.addEventListener('message', (event) => {
      if (event.origin !== 'http://localhost:3000') return;
      if (event.data && event.data.type === 'REQUEST_TOKEN') {
        console.log('[SimSP] Received REQUEST_TOKEN from iframe, sending token...');
        sendToken();
      }
    });

    // Also auto-send on iframe load
    iframe.addEventListener('load', () => {
      console.log('[SimSP] iframe loaded, sending token...');
      sendToken();
    });

    function sendToken() {
      iframe.contentWindow.postMessage({
        type: 'AUTH_TOKEN',
        token: FAKE_TOKEN,
        user: FAKE_USER
      }, 'http://localhost:3000');
      console.log('[SimSP] Token sent to iframe');
    }
  </script>
</body>
</html>
